name: Build distributable binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Python, CLI, and source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run pytest
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall .
      - name: Check source diff
        run: git diff --check
      - name: Smoke-test CLI
        run: |
          python cli.py --version
          python cli.py --help
          python cli.py --list

  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: OS-Readiness-Checker-Windows-x64.exe
            executable: OS-Readiness-Checker.exe
            spec: os_readiness_checker.spec
          - os: windows-latest
            artifact_name: OS-Readiness-Checker-CLI-Windows-x64.exe
            executable: OS-Readiness-Checker-CLI.exe
            spec: os_readiness_checker_cli.spec
          - os: ubuntu-latest
            artifact_name: OS-Readiness-Checker-Linux-x64
            executable: OS-Readiness-Checker
            spec: os_readiness_checker.spec
          - os: ubuntu-latest
            artifact_name: OS-Readiness-Checker-CLI-Linux-x64
            executable: OS-Readiness-Checker-CLI
            spec: os_readiness_checker_cli.spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install pyinstaller
      - name: Build binary
        run: python -m PyInstaller --noconfirm --clean ${{ matrix.spec }}
      - name: Rename binary
        shell: bash
        run: mv "dist/${{ matrix.executable }}" "dist/${{ matrix.artifact_name }}"
      - name: Smoke test CLI artifact
        if: contains(matrix.artifact_name, 'CLI')
        shell: bash
        run: |io.github.sage-yeti.OSReadinessChecker
          chmod +x "dist/${{ matrix.artifact_name }}" || true
          "dist/${{ matrix.artifact_name }}" --version
          "dist/${{ matrix.artifact_name }}" --help >/dev/null
          "dist/${{ matrix.artifact_name }}" --list >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
      - name: Generate SHA-256 checksums
        run: find release-assets -type f -exec sha256sum {} + | sed -E 's#release-assets/[^/]*/##' > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt

  appimage:
    name: Build Linux AppImage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OS-Readiness-Checker-Linux-x64
          path: dist
      - name: Build AppImage
        run: |
          chmod +x dist/OS-Readiness-Checker-Linux-x64 packaging/linux/build_appimage.sh
          packaging/linux/build_appimage.sh dist
      - name: Validate AppImage artifact
        run: |
          test -x dist/OS-Readiness-Checker-Linux-x86_64.AppImage
          ./dist/OS-Readiness-Checker-Linux-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/OS-Readiness-Checker.desktop
          test -f squashfs-root/OS-Readiness-Checker.svg
      - uses: actions/upload-artifact@v4
        with:
          name: OS-Readiness-Checker-Linux-x86_64.AppImage
          path: dist/OS-Readiness-Checker-Linux-x86_64.AppImage

  flatpak:
    name: Validate Flatpak package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-tk
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Sdk//46 org.gnome.Platform//46
      - name: Build and validate bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir packaging/flatpak/io.github.sage_yeti.OSReadinessChecker.yml
          flatpak build-bundle repo OS-Readiness-Checker-Linux-x86_64.flatpak io.github.sage-yeti.OSReadinessChecker
          test -s OS-Readiness-Checker-Linux-x86_64.flatpak
          python -m unittest -q
      - uses: actions/upload-artifact@v4
        with:
          name: OS-Readiness-Checker-Linux-x86_64.flatpak
          path: OS-Readiness-Checker-Linux-x86_64.flatpak
