name: Build Windows release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v

      - name: Install packager
        run: python -m pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name OS-Readiness-Checker --add-data "requirements.json;." app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OS-Readiness-Checker-Windows
          path: dist/OS-Readiness-Checker.exe

      - name: Publish v0.1.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 dist/OS-Readiness-Checker.exe --title "OS Readiness Checker v0.1.0" --notes "Initial Windows release. Download the executable and run it without installing Python."
